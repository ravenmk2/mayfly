name: Test

on:
  push:
    branches: [main, master, develop, dev]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build web frontend
        shell: bash
        run: bash scripts/build-web.sh

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13

  test:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build web frontend
        shell: bash
        run: bash scripts/build-web.sh

      - run: go vet ./...

      # -race needs cgo; leave CGO_ENABLED at the toolchain default (on).
      - run: go test -race ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run build

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Smoke-fuzz the packet decoder
        run: go test -fuzz=FuzzDecode -fuzztime=60s ./internal/packet/

  integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: mayfly
          MYSQL_DATABASE: mayfly_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD}"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      MAYFLY_TEST_MYSQL_DSN: root:mayfly@tcp(127.0.0.1:3306)/mayfly_test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: MySQL-backed store and auth integration tests
        run: go test -tags=integration ./internal/store/ ./internal/auth/
